<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Sarappo 4788 Rental Makassar</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body class="login-body">

  <!-- Background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grid-bg"></div>

  <div class="login-wrapper">
    <!-- Logo -->
    <div class="login-logo">
      <img src="../images/logo.png" alt="Logo Sarappo 4788 Rental" class="admin-logo-img">
      <div class="logo-text">
        <div class="logo-title">SARAPPO <span>4788</span></div>
        <div class="logo-sub">Panel Admin</div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-card-header">
        <div class="lock-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <h1 class="login-title">Masuk ke Panel Admin</h1>
        <p class="login-subtitle">Khusus pengelola Sarappo 4788 Rental Makassar</p>
      </div>

      <!-- Error Message -->
      <div class="alert-error" id="login-error" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="error-text">Username atau password salah.</span>
      </div>

      <form class="login-form" id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="admin-user">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Username
          </label>
          <input type="text" id="admin-user" class="form-input" placeholder="Masukkan username admin" required autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-pass">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            Password
          </label>
          <div class="input-wrap">
            <input type="password" id="admin-pass" class="form-input" placeholder="Masukkan password" required>
            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Tampilkan password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="eye-icon"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>

        <div class="form-remember">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me">
            <span class="checkmark"></span>
            Ingat sesi login
          </label>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Masuk ke Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 17l5-5-5-5v10zm-6 0l5-5-5-5v10z"/></svg>
          <div class="btn-loader" id="btn-loader" style="display:none;"></div>
        </button>
      </form>

      <div class="login-footer">
        <a href="../index.html" class="back-to-site">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Kembali ke Website Utama
        </a>
      </div>
    </div>

    <p class="login-hint">💡 Default: <strong>admin</strong> / <strong>sarappo4788</strong></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
